          <circle cx="31.25" cy="93.75" r="22"/><circle cx="156.25" cy="93.75" r="22"/><circle cx="281.25" cy="93.75" r="22"/><circle cx="406.25" cy="93.75" r="22"/>
          <circle cx="93.75" cy="156.25" r="22"/><circle cx="218.75" cy="156.25" r="22"/><circle cx="343.75" cy="156.25" r="22"/><circle cx="468.75" cy="156.25" r="22"/>
        </g>
        <g fill="url(#ivory)" stroke="#b7a679" stroke-width="3">
          <circle cx="31.25" cy="406.25" r="22"/><circle cx="156.25" cy="406.25" r="22"/><circle cx="281.25" cy="406.25" r="22"/><circle cx="406.25" cy="406.25" r="22"/>
          <circle cx="93.75" cy="468.75" r="22"/><circle cx="218.75" cy="468.75" r="22"/><circle cx="343.75" cy="468.75" r="22"/><circle cx="468.75" cy="468.75" r="22"/>
          <circle cx="31.25" cy="343.75" r="22"/><circle cx="156.25" cy="343.75" r="22"/><circle cx="281.25" cy="343.75" r="22"/><circle cx="406.25" cy="343.75" r="22"/>
        </g>
