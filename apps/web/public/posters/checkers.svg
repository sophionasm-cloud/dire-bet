          <circle cx="31.25" cy="406.25" r="12"/><circle cx="156.25" cy="406.25" r="12"/><circle cx="281.25" cy="406.25" r="12"/><circle cx="406.25" cy="406.25" r="12"/>
        </g>
      </g>
