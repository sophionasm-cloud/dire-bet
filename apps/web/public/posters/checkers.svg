    <rect width="620" height="620" rx="34" fill="#57300f" opacity=".55" transform="translate(0 12)"/>
    <rect width="620" height="620" rx="30" fill="url(#frame)"/>
    <rect x="5" y="5" width="610" height="610" rx="26" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
    <rect x="58" y="58" width="504" height="504" rx="8" fill="#5c3312"/>
    <g transform="translate(62 62)">
      <g>
        <rect width="62.5" height="62.5" fill="url(#light)"/><rect x="62.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="125" width="62.5" height="62.5" fill="url(#light)"/><rect x="187.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="250" width="62.5" height="62.5" fill="url(#light)"/><rect x="312.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="375" width="62.5" height="62.5" fill="url(#light)"/><rect x="437.5" width="62.5" height="62.5" fill="url(#dark)"/>
        <rect y="62.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="62.5" y="62.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="125" y="62.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="187.5" y="62.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="250" y="62.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="312.5" y="62.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="375" y="62.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="437.5" y="62.5" width="62.5" height="62.5" fill="url(#light)"/>
        <rect y="125" width="62.5" height="62.5" fill="url(#light)"/><rect x="62.5" y="125" width="62.5" height="62.5" fill="url(#dark)"/><rect x="125" y="125" width="62.5" height="62.5" fill="url(#light)"/><rect x="187.5" y="125" width="62.5" height="62.5" fill="url(#dark)"/><rect x="250" y="125" width="62.5" height="62.5" fill="url(#light)"/><rect x="312.5" y="125" width="62.5" height="62.5" fill="url(#dark)"/><rect x="375" y="125" width="62.5" height="62.5" fill="url(#light)"/><rect x="437.5" y="125" width="62.5" height="62.5" fill="url(#dark)"/>
        <rect y="187.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="62.5" y="187.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="125" y="187.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="187.5" y="187.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="250" y="187.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="312.5" y="187.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="375" y="187.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="437.5" y="187.5" width="62.5" height="62.5" fill="url(#light)"/>
        <rect y="250" width="62.5" height="62.5" fill="url(#light)"/><rect x="62.5" y="250" width="62.5" height="62.5" fill="url(#dark)"/><rect x="125" y="250" width="62.5" height="62.5" fill="url(#light)"/><rect x="187.5" y="250" width="62.5" height="62.5" fill="url(#dark)"/><rect x="250" y="250" width="62.5" height="62.5" fill="url(#light)"/><rect x="312.5" y="250" width="62.5" height="62.5" fill="url(#dark)"/><rect x="375" y="250" width="62.5" height="62.5" fill="url(#light)"/><rect x="437.5" y="250" width="62.5" height="62.5" fill="url(#dark)"/>
        <rect y="312.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="62.5" y="312.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="125" y="312.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="187.5" y="312.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="250" y="312.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="312.5" y="312.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="375" y="312.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="437.5" y="312.5" width="62.5" height="62.5" fill="url(#light)"/>
        <rect y="375" width="62.5" height="62.5" fill="url(#light)"/><rect x="62.5" y="375" width="62.5" height="62.5" fill="url(#dark)"/><rect x="125" y="375" width="62.5" height="62.5" fill="url(#light)"/><rect x="187.5" y="375" width="62.5" height="62.5" fill="url(#dark)"/><rect x="250" y="375" width="62.5" height="62.5" fill="url(#light)"/><rect x="312.5" y="375" width="62.5" height="62.5" fill="url(#dark)"/><rect x="375" y="375" width="62.5" height="62.5" fill="url(#light)"/><rect x="437.5" y="375" width="62.5" height="62.5" fill="url(#dark)"/>
        <rect y="437.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="62.5" y="437.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="125" y="437.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="187.5" y="437.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="250" y="437.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="312.5" y="437.5" width="62.5" height="62.5" fill="url(#light)"/><rect x="375" y="437.5" width="62.5" height="62.5" fill="url(#dark)"/><rect x="437.5" y="437.5" width="62.5" height="62.5" fill="url(#light)"/>
