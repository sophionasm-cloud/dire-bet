<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Wooden checkers board with ivory and graphite pieces">
  <defs>
    <radialGradient id="bg" cx="55%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a373d"/>
      <stop offset=".55" stop-color="#242328"/>
      <stop offset="1" stop-color="#161519"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad7040"/>
      <stop offset=".38" stop-color="#945b30"/>
      <stop offset=".72" stop-color="#7d4a24"/>
      <stop offset="1" stop-color="#6e3e16"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ddba"/>
      <stop offset=".7" stop-color="#dccfa5"/>
      <stop offset="1" stop-color="#cfbf90"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a06637"/>
      <stop offset=".55" stop-color="#945b30"/>
      <stop offset="1" stop-color="#784620"/>
    </linearGradient>
    <radialGradient id="ivory" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".44" stop-color="#efe4c4"/>
      <stop offset=".68" stop-color="#e0d2a8"/>
      <stop offset="1" stop-color="#c3b183"/>
    </radialGradient>
    <radialGradient id="graphite" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#5f656f"/>
      <stop offset=".46" stop-color="#3a3e45"/>
      <stop offset=".68" stop-color="#30343a"/>
      <stop offset="1" stop-color="#191c20"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c58d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e2c58d" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="pieceShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#0b0603" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="700" cy="250" rx="430" ry="250" fill="url(#glow)"/>

