  </g>

  <g filter="url(#pieceShadow)" transform="translate(150 620)">
    <circle cx="0" cy="0" r="78" fill="url(#ivory)" stroke="#b7a679" stroke-width="5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#8d7b4d" stroke-opacity=".55" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="56" fill="#b18c3c">♛</text>
  </g>
  <g filter="url(#pieceShadow)" transform="translate(1075 185)">
    <circle cx="0" cy="0" r="64" fill="url(#graphite)" stroke="#737981" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
  </g>
</svg>
